<!DOCTYPE html>
<head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>
<div class="container">
    <ul class="comments">
        <li class="comment">
            <div class="comment-header">
                <div class="head-name">Глеб Фокин</div>
                <div class="head-time">12.02.22 12:18</div>
            </div>
            <div class="comment-body">
                <div class="comment-text">
                    Это будет первый комментарий на этой странице
                </div>
            </div>
            <div class="comment-footer">
                <div class="likes">
                    <span class="likes-counter">3</span>
                    <button class="like-button"></button>
                </div>
            </div>
        </li>
        <li class="comment">
            <div class="comment-header">
                <div>Варвара Н.</div>
                <div>13.02.22 19:22</div>
            </div>
            <div class="comment-body">
                <div class="comment-text">
                    Мне нравится как оформлена эта страница! ❤
                </div>
                <div class="comment-footer">
                    <div class="likes">
                        <span class="likes-counter">75</span>
                        <button class="like-button -active-like"></button>
                    </div>
                </div>
            </div>
        </li>
    </ul>
    <div class="add-form">
        <label>
            <input type="text" class="add-form-name" placeholder="Введите ваше имя"/>
        </label>
        <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
        <div class="add-form-row">
            <button class="add-form-button">Написать</button>
        </div>
    </div>
</div>
</body>

<script>
    "use strict";

    const comments = [
        {
            name: "Глеб Фокин",
            date: "12.02.22 12:18",
            text: "Это будет первый комментарий на этой странице",
            likes: 3,
            isLiked: false
        },
        {
            name: "Варвара Н.",
            date: "13.02.22 19:22",
            text: "Мне нравится как оформлена эта страница! ❤",
            likes: 75,
            isLiked: true
        }
    ];

    const addList = document.querySelector(".comments");
    const addName = document.querySelector(".add-form-name");
    const addText = document.querySelector(".add-form-text");
    const addComment = document.querySelector(".add-form-button");

    const escapeHTML = (str) => {
        return str.replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    };

    const getFormattedDate = () => {
        const now = new Date();
        return `${now.toLocaleDateString('ru-RU', {
            day: '2-digit',
            month: '2-digit',
            year: '2-digit'
        })} ${now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'})}`;
    };

    const renderComments = () => {
        addList.innerHTML = comments.map((comment, index) => `
        <li class="comment" data-index="${index}">
            <div class="comment-header">
                <div class="head-name">${escapeHTML(comment.name)}</div>
                <div class="head-time">${comment.date}</div>
            </div>
            <div class="comment-body">
                <div class="comment-text">${escapeHTML(comment.text)}</div>
            </div>
            <div class="comment-footer">
                <div class="likes">
                    <span class="likes-counter">${comment.likes}</span>
                    <button class="like-button ${comment.isLiked ? "-active-like" : ""}" data-index="${index}"></button>
                </div>
            </div>
        </li>`).join("");

        document.querySelectorAll(".like-button").forEach(button => {
            button.addEventListener("click", (event) => {
                event.stopPropagation();
                const index = button.dataset.index;
                comments[index].isLiked = !comments[index].isLiked;
                comments[index].likes += comments[index].isLiked ? 1 : -1;
                renderComments();
            });
        });

        document.querySelectorAll(".comment").forEach(comment => {
            comment.addEventListener("click", () => {
                const index = comment.dataset.index;
                addText.value = `> ${escapeHTML(comments[index].text)}\n`;
                addName.value = comments[index].name;
            });
        });
    };

    addComment.addEventListener("click", () => {
        if (addName.value.trim() === "" || addText.value.trim() === "") {
            alert("Введите имя и комментарий");
            return;
        }

        comments.push({
            name: escapeHTML(addName.value),
            date: getFormattedDate(),
            text: escapeHTML(addText.value),
            likes: 0,
            isLiked: false
        });

        addName.value = "";
        addText.value = "";
        renderComments();
    });

    renderComments();
</script>
</html>
