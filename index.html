<!DOCTYPE html>
<head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>
<div class="container">
    <div class="comments-loading" style="display: block;">Загрузка комментариев...</div>
    <ul class="comments" style="display: none;"></ul>
    <div class="add-form">
        <label>
            <input type="text" class="add-form-name" placeholder="Введите ваше имя"/>
        </label>
        <textarea class="add-form-text" placeholder="Введите ваш комментарий" rows="4"></textarea>
        <div class="add-form-row">
            <button class="add-form-button">Написать</button>
        </div>
    </div>
    <div class="comment-loading" style="display: none;">Комментарий добавляется...</div>
</div>

<script>
    "use strict";

    const API_URL = "https://wedev-api.sky.pro/api/v1/ttttemaa/comments";
    const elements = {
        list: document.querySelector(".comments"),
        commentsLoading: document.querySelector(".comments-loading"),
        name: document.querySelector(".add-form-name"),
        text: document.querySelector(".add-form-text"),
        button: document.querySelector(".add-form-button"),
        addForm: document.querySelector(".add-form"),
        commentLoading: document.querySelector(".comment-loading"),
    };
    let comments = [];
    let formData = {name: "", text: ""};

    const escapeHTML = (str) => str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const formatDate = (isoDate) => {
        const date = new Date(isoDate);
        return `${date.toLocaleString("ru-RU", {
            day: "2-digit",
            month: "2-digit",
            year: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
        })}`;
    };

    const delay = (interval = 300) => {
        return new Promise((resolve) => {
            setTimeout(() => {
                resolve();
            }, interval);
        });
    };

    const renderComments = () => {
        elements.list.innerHTML = comments
            .map(
                (c, i) => `
        <li class="comment" data-index="${i}">
          <div class="comment-header">
            <div class="head-name">${escapeHTML(c.name)}</div>
            <div class="head-time">${c.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">${escapeHTML(c.text)}</div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${c.likes}</span>
              <button class="like-button ${c.isLiked ? "-active-like" : ""} ${
                    c.isLikeLoading ? "-loading-like" : ""
                }" data-index="${i}"></button>
            </div>
          </div>
        </li>`
            )
            .join("");

        elements.list.querySelectorAll(".like-button").forEach((btn) =>
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const i = btn.dataset.index;
                if (comments[i].isLikeLoading) return;

                comments[i].isLikeLoading = true;
                btn.disabled = true;
                renderComments();

                delay(2000)
                    .then(() => {
                        comments[i].likes = comments[i].isLiked
                            ? comments[i].likes - 1
                            : comments[i].likes + 1;
                        comments[i].isLiked = !comments[i].isLiked;
                        comments[i].isLikeLoading = false;
                        renderComments();
                    })
                    .catch((error) => {
                        console.error("Like error:", error);
                        comments[i].isLikeLoading = false;
                        renderComments();
                    });
            })
        );

        elements.list.querySelectorAll(".comment").forEach((comment) =>
            comment.addEventListener("click", () => {
                const i = comment.dataset.index;
                elements.text.value = `> ${escapeHTML(comments[i].text)}\n`;
                elements.name.value = comments[i].name;
                formData.name = elements.name.value;
                formData.text = elements.text.value;
            })
        );
    };

    const fetchComments = () => {
        return fetch(API_URL)
            .then((response) => {
                if (!response.ok) {
                    if (response.status >= 500 && response.status < 600) {
                        throw new Error("Сервер сломался, попробуй позже");
                    }
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(({comments: data}) => {
                comments = data.map((c) => ({
                    name: c.author.name,
                    date: formatDate(c.date),
                    text: c.text,
                    likes: 0,
                    isLiked: false,
                    isLikeLoading: false,
                }));
                renderComments();
            })
            .catch((error) => {
                console.error("Fetch error:", error);
                if (error.name === "TypeError" || error.message.includes("Network")) {
                    alert("Проверьте подключение к интернету и попробуйте позже");
                } else {
                    alert(error.message || "Не удалось загрузить комментарии");
                }
            })
            .finally(() => {
                elements.commentsLoading.style.display = "none";
                elements.list.style.display = "block";
            });
    };

    const postComment = (name, text, isRetry = false) => {
        if (name.length < 3 || text.length < 3) {
            alert("Имя и комментарий должны быть не короче 3 символов");
            return Promise.resolve();
        }

        elements.addForm.style.display = "none";
        elements.commentLoading.style.display = "block";
        elements.button.disabled = true;

        return fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                name,
                text,
                forceError: isRetry, // ошибка 500
            }),
        })
            .then((response) => {
                if (!response.ok) {
                    if (response.status === 400) {
                        throw new Error("Имя и комментарий должны быть не короче 3 символов");
                    }
                    if (response.status >= 500 && response.status < 600) {
                        throw new Error("Сервер сломался, попробуй позже");
                    }
                    return response.json().then((errorData) => {
                        throw new Error(errorData.error || `HTTP ${response.status}`);
                    });
                }
                return response.json();
            })
            .then(() => {
                return fetchComments();
            })
            .then(() => {
                elements.name.value = "";
                elements.text.value = "";
                formData.name = "";
                formData.text = "";
            })
            .catch((error) => {
                console.error("Post error:", error);
                if (error.message === "Сервер сломался, попробуй позже" && !isRetry) {
                    // повтор ошибки 500
                    return delay(1000).then(() => postComment(name, text, true));
                }
                if (error.name === "TypeError" || error.message.includes("Network")) {
                    alert("Проверьте подключение к интернету и попробуйте позже");
                } else {
                    alert(error.message || "Ошибка добавления комментария");
                }
            })
            .finally(() => {
                elements.addForm.style.display = "block";
                elements.commentLoading.style.display = "none";
                elements.button.disabled = false;
            });
    };

    // сохранение данных в полях ввода
    elements.name.addEventListener("input", () => {
        formData.name = elements.name.value;
    });
    elements.text.addEventListener("input", () => {
        formData.text = elements.text.value;
    });

    // восстановление данных в полях ввода
    const restoreFormData = () => {
        elements.name.value = formData.name;
        elements.text.value = formData.text;
    };

    elements.button.addEventListener("click", () => {
        postComment(elements.name.value.trim(), elements.text.value.trim());
    });

    fetchComments();
    restoreFormData(); // восстановить данные в полях ввода при загрузке
</script>
</body>
</html>
