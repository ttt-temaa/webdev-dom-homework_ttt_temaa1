<!DOCTYPE html>
<head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>
<div class="container">
    <ul class="comments"></ul>
    <div class="add-form">
        <label>
            <input type="text" class="add-form-name" placeholder="Введите ваше имя"/>
        </label>
        <textarea class="add-form-text" placeholder="Введите ваш комментарий" rows="4"></textarea>
        <div class="add-form-row">
            <button class="add-form-button">Написать</button>
        </div>
    </div>
</div>

<script>
    "use strict";

    const API_URL = "https://wedev-api.sky.pro/api/v1/ttttemaa/comments";
    const elements = {
        list: document.querySelector(".comments"),
        name: document.querySelector(".add-form-name"),
        text: document.querySelector(".add-form-text"),
        button: document.querySelector(".add-form-button"),
    };
    let comments = [];

    const escapeHTML = (str) => str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const formatDate = (isoDate) => {
        const date = new Date(isoDate);
        return `${date.toLocaleString("ru-RU", {
            day: "2-digit",
            month: "2-digit",
            year: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
        })}`;
    };

    const renderComments = () => {
        elements.list.innerHTML = comments
            .map(
                (c, i) => `
        <li class="comment" data-index="${i}">
          <div class="comment-header">
            <div class="head-name">${escapeHTML(c.name)}</div>
            <div class="head-time">${c.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">${escapeHTML(c.text)}</div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${c.likes}</span>
              <button class="like-button ${c.isLiked ? "-active-like" : ""}" data-index="${i}"></button>
            </div>
          </div>
        </li>`
            )
            .join("");

        elements.list.querySelectorAll(".like-button").forEach((btn) =>
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const i = btn.dataset.index;
                comments[i].isLiked = !comments[i].isLiked;
                comments[i].likes += comments[i].isLiked ? 1 : -1;
                renderComments();
            })
        );

        elements.list.querySelectorAll(".comment").forEach((comment) =>
            comment.addEventListener("click", () => {
                const i = comment.dataset.index;
                elements.text.value = `> ${escapeHTML(comments[i].text)}\n`;
                elements.name.value = comments[i].name;
            })
        );
    };

    const fetchComments = async () => {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const {comments: data} = await response.json();
            comments = data.map((c) => ({
                name: c.author.name,
                date: formatDate(c.date),
                text: c.text,
                likes: 0,
                isLiked: false,
            }));
            renderComments();
        } catch (error) {
            console.error("Fetch error:", error);
            alert(`Не удалось загрузить комментарии: ${error.message}`);
        }
    };

    const postComment = async () => {
        const name = elements.name.value.trim();
        const text = elements.text.value.trim();

        if (name.length < 3 || text.length < 3) {
            alert("Имя и комментарий должны быть ≥ 3 символов");
            return;
        }

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({name, text}),
            });
            if (!response.ok) throw new Error((await response.json()).error);
            await fetchComments();
            elements.name.value = "";
            elements.text.value = "";
        } catch (error) {
            console.error("Post error:", error);
            alert(`Ошибка добавления: ${error.message}`);
        }
    };

    elements.button.addEventListener("click", postComment);
    fetchComments();
</script>
</body>
</html>
